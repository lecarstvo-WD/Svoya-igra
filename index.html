<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Своя игра — Логика 7 класс</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Стартовый экран -->
    <div id="start-screen" class="screen active">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-6 text-center">
                    <h1 class="game-title mb-4">🧠 Своя игра</h1>
                    <p class="lead text-muted mb-4">Логические задачи для 7 класса</p>
                    <div class="card bg-dark text-light p-4">
                        <h4 class="mb-3">Количество игроков</h4>
                        <div class="btn-group mb-4" role="group" id="player-count-group">
                            <button type="button" class="btn btn-outline-light" data-count="2">2</button>
                            <button type="button" class="btn btn-outline-light active" data-count="3">3</button>
                            <button type="button" class="btn btn-outline-light" data-count="4">4</button>
                        </div>
                        <div id="player-names" class="mb-3"></div>
                        <button id="start-game-btn" class="btn btn-warning btn-lg w-100">Начать игру</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Игровое поле -->
    <div id="game-screen" class="screen">
        <div class="container-fluid py-3">
            <!-- Таблица игроков -->
            <div id="players-table" class="row g-2 mb-3"></div>
            <!-- Игровая таблица -->
            <div id="game-board" class="game-board"></div>
            <div class="text-center mt-3">
                <button id="reset-btn" class="btn btn-outline-danger btn-sm">Начать заново</button>
            </div>
        </div>
    </div>

    <!-- Экран вопроса -->
    <div id="question-screen" class="screen">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card question-card">
                        <div class="card-header text-center">
                            <span id="question-category" class="badge bg-warning text-dark fs-6"></span>
                            <span id="question-points" class="badge bg-light text-dark fs-6 ms-2"></span>
                        </div>
                        <div class="card-body text-center">
                            <p id="question-text" class="card-text fs-4 mb-4"></p>
                            <div id="answer-block" class="d-none">
                                <hr>
                                <p id="answer-text" class="text-warning fs-5"></p>
                            </div>
                        </div>
                        <div class="card-footer">
                            <div class="mb-2">
                                <label class="form-label text-muted">Кто отвечает?</label>
                                <select id="answering-player" class="form-select"></select>
                            </div>
                            <div class="d-grid gap-2">
                                <button id="show-answer-btn" class="btn btn-outline-warning">Показать ответ</button>
                                <div id="score-buttons" class="d-none row g-2">
                                    <div class="col-6">
                                        <button id="correct-btn" class="btn btn-success btn-lg">Верно (+)</button>
                                    </div>
                                    <div class="col-6">
                                        <button id="wrong-btn" class="btn btn-danger btn-lg">Неверно (-)</button>
                                    </div>
                                </div>
                                <button id="close-question-btn" class="btn btn-secondary d-none">Закрыть вопрос</button>
                                <button id="skip-btn" class="btn btn-outline-secondary btn-sm">Никто не ответил</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Экран результатов -->
    <div id="results-screen" class="screen">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-6 text-center">
                    <h1 class="game-title mb-4">🏆 Результаты</h1>
                    <div id="results-list" class="mb-4"></div>
                    <button id="play-again-btn" class="btn btn-warning btn-lg w-100">Играть снова</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
